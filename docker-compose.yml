# Production-style local stack: filigrane's frontend + nginx.
#
# nginx serves the built SPA and proxies /api/* to Workflow's Main.Api,
# injecting X-Api-Key server-side so the browser never sees it (the prod
# analog of the vite dev proxy). Main.Api runs as a SEPARATE stack (see the
# Workflow repo's deploy/docker-compose.yml, bound to 127.0.0.1:8080), matching
# the production topology where the API and frontend live on different hosts.
#
# Point WORKFLOW_API_URL at that API. On Linux, host.docker.internal resolves
# to the host via the host-gateway mapping below.
#
#   WORKFLOW_API_KEY=<same key as Main.Api/.env> \
#   WORKFLOW_API_URL=http://host.docker.internal:8080 \
#   docker compose up
services:
  frontend:
    build:
      context: ./frontend
    image: filigrane-frontend
    container_name: filigrane-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      WORKFLOW_API_URL: "${WORKFLOW_API_URL:-http://host.docker.internal:8080}"
      WORKFLOW_API_KEY: "${WORKFLOW_API_KEY:?set WORKFLOW_API_KEY to Main.Api's API_KEY}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
