# NOTE: the frontend's own nginx (frontend/nginx.conf) still proxies /api/*
# to a local `api` service that no longer exists. That backend has moved to
# the Workflow repo's Main.Api, deployed separately (see its deploy/README.md).
# This compose file is not production-ready until a later stone points nginx
# at the deployed Main.Api and injects X-Api-Key server-side there.
services:
  frontend:
    build:
      context: ./frontend
    image: filigrane-frontend
    container_name: filigrane-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
